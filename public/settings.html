<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Socializeit — Settings</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="row">
    <div>
      <h1>Settings</h1>
      <p>Your API keys. They stay on this machine only, encrypted.</p>
    </div>
    <a class="settings-link" href="/">Back to posts</a>
  </div>
</header>

<main class="wrap">
  <div id="notice"></div>
  <p class="muted">Socializeit posts with <b>your own</b> developer apps. Add each network's keys below. Nothing is hard-coded, and nothing is sent anywhere except to that network when you post.</p>
  <div id="settings-list"><p class="empty">Loading...</p></div>
  <div class="actions">
    <button class="btn btn-primary" id="save-btn" type="button">Save keys</button>
  </div>
  <p class="small" id="save-msg"></p>
</main>

<script src="/settings.js"></script>
</body>
</html>
